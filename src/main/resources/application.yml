spring:
  config:
    import: "optional:configtree:/run/secrets/"
  application:
    name: schub.core
  data:
    mongodb:
      uri: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@${MONGO_HOST:bot-mongo}:27017/${MONGO_DB}?authSource=${MONGO_DB}

server:
  port: 8080

# Secret partagé par tous les services Schub. Aucun appel entre services sans lui.
schub:
  internal-secret: ${SCHUB_INTERNAL_SECRET:change-me-internal-secret}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
